name: notivera_flutter
description: Flutter plugin wrapping the Notivera native Android and iOS SDKs.
version: 5.0.1
homepage: https://github.com/Notivera/flutter-sdk
repository: https://github.com/Notivera/flutter-sdk
issue_tracker: https://github.com/Notivera/flutter-sdk/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.notivera.notivera_flutter
        pluginClass: NotiveraFlutterPlugin
      ios:
        pluginClass: NotiveraFlutterPlugin
